<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카카오톡 공유 테스트 - 파티초대장</title>
<style>
  body { font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; max-width: 480px; margin: 60px auto; padding: 0 20px; }
  h2 { margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; }
  button { font-size: 16px; padding: 14px 22px; border-radius: 10px; border: none; background: #FEE500; cursor: pointer; font-weight: 700; }
  button:hover { filter: brightness(0.97); }
  #status { margin-top: 16px; padding: 12px 14px; border-radius: 8px; background: #f4f4f4; font-size: 13px; white-space: pre-wrap; }
</style>
</head>
<body>
  <h2>🎫 카카오톡 공유 테스트</h2>
  <p class="sub">아래 버튼을 누르면 실제로 카카오톡 "나에게 보내기" 또는 친구 선택 창이 뜹니다. 로그인 창이 뜨면 본인 카카오 계정으로 로그인하세요.</p>
  <button id="btn">카카오톡으로 공유하기</button>
  <div id="status">대기 중...</div>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.1/kakao.min.js"></script>
  <script>
    var statusEl = document.getElementById('status');
    try {
      Kakao.init('6a2e19be6f392dde985a9a6f79ae68db');
      statusEl.textContent = 'SDK 초기화 완료 (isInitialized: ' + Kakao.isInitialized() + ')\n버튼을 눌러 테스트하세요.';
    } catch (e) {
      statusEl.textContent = '초기화 오류: ' + e.message;
    }

    var SITE = 'https://maverick203.github.io/party-invite-test';

    document.getElementById('btn').addEventListener('click', function () {
      try {
        Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: '월요일 스킵 쿠폰 🤯',
            description: '월요일을 스킵하게 해드립니다 🥳',
            imageUrl: SITE + '/monday-skip-banner-v2.png',
            imageWidth: 800,
            imageHeight: 419,
            link: {
              mobileWebUrl: SITE + '/rsvp.html?r=thanks',
              webUrl: SITE + '/rsvp.html?r=thanks'
            }
          },
          buttons: [
            {
              title: '사용하기',
              link: { mobileWebUrl: SITE + '/rsvp.html?r=yes', webUrl: SITE + '/rsvp.html?r=yes' }
            },
            {
              title: '거절하기',
              link: { mobileWebUrl: SITE + '/rsvp.html?r=no', webUrl: SITE + '/rsvp.html?r=no' }
            }
          ]
        });
        statusEl.textContent = '공유 요청을 보냈습니다. 카카오톡 창이 뜨는지 확인하세요.';
      } catch (e) {
        statusEl.textContent = '공유 오류: ' + e.message;
      }
    });
  </script>
</body>
</html>
