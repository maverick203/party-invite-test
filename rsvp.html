<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회신 처리 중</title>
<style>
  html,body{margin:0;height:100%;background:#100c1c;color:#a89fc9;font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;}
  .wrap{display:flex;align-items:center;justify-content:center;height:100%;flex-direction:column;gap:14px;padding:24px;text-align:center;box-sizing:border-box;}
  .dot{width:9px;height:9px;border-radius:50%;background:#e8b24a;animation:pulse 1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
  a.fallback{display:none;margin-top:6px;color:#2c1c02;background:linear-gradient(180deg,#f4c469,#e8b24a);padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px;}
  a.fallback.show{display:inline-block;}
</style>
</head>
<body>
<div class="wrap">
  <div class="dot" aria-hidden="true"></div>
  <a id="fallback" class="fallback" href="#">이메일 앱이 안 열리면 여기를 눌러주세요</a>
</div>
<script>
(function(){
  var HOST_EMAIL = "jemin.hong.art@gmail.com";
  var EVENT_LINE = '이벤트: 지민의 서른 번째 루프탑 생일 파티\n일시: 2026.10.03 (토) 오후 7:00';
  var params = new URLSearchParams(window.location.search);
  var r = params.get('r');
  var status = r === 'no' ? '불참' : '참석';
  var subject = encodeURIComponent('[파티 RSVP] ' + status);
  var body = encodeURIComponent(
    '"' + status + '"로 회신합니다.\n\n' + EVENT_LINE + '\n\n(카카오톡 초대장에서 바로 전달된 회신입니다.)'
  );
  var mailto = 'mailto:' + HOST_EMAIL + '?subject=' + subject + '&body=' + body;
  var fb = document.getElementById('fallback');
  fb.href = mailto;
  window.location.replace(mailto);
  setTimeout(function(){ fb.classList.add('show'); }, 900);
})();
</script>
</body>
</html>
